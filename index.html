.tag.v{background:#15803d33;color:var(--ok);font-weight:700}

.ck.on{background:var(--ac)}

nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}

main>*{animation:pop .3s}@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.big{font-size:44px;font-weight:800;text-align:center;color:var(--ac)}.fb{font-weight:700;margin:4px 0 10px}
.opt.sel{border-color:var(--ac);background:var(--ln)}
input{width:100%;padding:12px;margin:6px 0;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-size:15px}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:9;animation:fall 1.8s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
